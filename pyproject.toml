[project]
name = "photone"
version = "0.1.0"
description = "A raw photo editor built around a color wheel"
license = "MIT"
license-files = ["LICENSE", "photone/ui/fonts/OFL.txt"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",   # Qt Quick: the window, the interface, and the GPU surface (SDR or HDR)
    "rawpy==0.28.0",  # LibRaw 0.22.2, bundled in the wheel: decodes camera raw files. Pinned (docs/deps.md)
    "numpy>=2.0",     # the pixel arrays rawpy returns, packed for the GPU
    # ONNX Runtime runs the neural denoiser's net (photone/denoise.py). On Linux its CUDA
    # build with NVIDIA's libraries as wheels (some 2 GB; any other card there: the processor);
    # on Windows its DirectML build, which runs on any maker's card.
    "onnxruntime-gpu[cuda,cudnn]>=1.22; sys_platform == 'linux'",
    "onnxruntime-directml>=1.22; sys_platform == 'win32'",
]

[project.scripts]
photone = "photone.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".ponytail", ".dev", "scripts", "research"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C90", "PLR0913", "PLR0915"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.per-file-ignores]
# Checks read best as long, flat lists of asserts.
"tests/*" = ["E501", "PLR0915"]

[tool.ruff.lint.pylint]
max-statements = 25
max-args = 5
